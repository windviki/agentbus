name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (linux, go + node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi
      - name: license copies
        run: |
          cmp LICENSE npm/cli/LICENSE
          for d in npm/platform/*/; do cmp LICENSE "$d/LICENSE"; done
      - name: docs links
        run: python3 scripts/check-docs.py
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...
      - name: installer e2e
        run: ./test/setup.sh
      - name: bus e2e
        run: ./test/e2e.sh
      - name: npm packaging
        run: ./scripts/test-npm.sh

  cross-build:
    name: cross-build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: build
        env:
          TARGET: ${{ matrix.target }}
        run: |
          os="${TARGET%/*}"; arch="${TARGET#*/}"
          CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -o /tmp/agentbus .
      - name: smoke
        run: go version -m /tmp/agentbus | sed -n '1,3p'
